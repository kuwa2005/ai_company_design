scheduler:
  max_concurrent_workers: 4
  max_validation_workers: 2
  poll_interval_seconds: 2
  max_workers_per_project: 3

worker:
  heartbeat_seconds: 30
  idle_timeout_minutes: 10
  hard_timeout_minutes: 45

retry:
  default_max_retries: 2

circuit_breaker:
  failure_threshold: 5
  window_minutes: 10
  cooldown_minutes: 30

staffing:
  auto_approve: true
  role_capacity:
    coding_worker: 4
    backend_engineer: 3
    frontend_engineer: 2
    engineering_manager: 2
    technical_director: 1
    reviewer: 4
    judge: 2
    test_reviewer: 2
    spec_reviewer: 2
    security_reviewer: 2
    edge_case_reviewer: 2
    architecture_reviewer: 1
    completeness_auditor: 1
    usability_auditor: 1
    quality_auditor: 1
    project_coordinator: 1
    product_planner: 1
    customer_success: 1
    compliance_auditor: 1
    test_auditor: 1
    it_operations: 1
    sales: 1
    maintenance: 1
    sales_director: 1
    marketing_director: 1
    legal_director: 1
    operations_director: 1

# 重役会議の決議 → 部門作業指示（Work Order）の起票。
# 上限は「起票の上限」で、実行時の並列数・予算は role_capacity / Cost Governor が別に効く。
meeting_resolutions:
  enabled: true
  max_orders_per_meeting: 4
  max_orders_per_department: 2
  max_estimated_cost_per_meeting_usd: 0.0   # 0 = 件数上限のみ（定額サブスク運用）
  priority_ceiling: 80                      # 計画の中核タスク（〜85）を追い越さない
  departments: [legal, sales, marketing, operations]
  inject_decisions: true                    # 社長の回答（decide）を後続プロンプトへ DATA として渡す
  max_decision_revisions_per_project: 3     # 回答で完了済みの部門作業を改訂する上限（0 = しない）
  write_deliverables: true                  # 部門の成果物を <案件dir>/docs/<部>/<タスクid>.md に書き出す（秘書が書く。Worker は読み取り専用のまま）
  deliverables_dir: docs

# 部長を短命 Worker（kind=head_brief, 読み取り専用）として呼ぶ任意機能。既定オフ。
# 部長ロールの読み取り専用プロファイル（code.read / validation.read / project.report）は
# config/permissions.yaml に同梱済み（社長承認 2026-11-18）。オンにすると Goal が部長のプロンプトにも送られる。
# プロファイルが無い部長は起票せず、その部はテンプレートの Work Order にフォールバックする。
executive_meeting:
  head_llm:
    enabled: false
    departments: [sales, marketing, legal, operations]
    max_heads_per_meeting: 4
    estimated_cost_per_head: 0.05
    max_retries: 1
    fallback: template        # template | none
    max_wait_cycles: 3        # 実装完了後、未着手の所見に与える配車の機会（回）。超えたらテンプレートへ戻す。0 = すぐ戻す
