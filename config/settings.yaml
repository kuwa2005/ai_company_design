scheduler:
  max_concurrent_workers: 4
  max_validation_workers: 2
  poll_interval_seconds: 2
  max_workers_per_project: 3

worker:
  heartbeat_seconds: 30
  idle_timeout_minutes: 10
  hard_timeout_minutes: 45

retry:
  default_max_retries: 2

circuit_breaker:
  failure_threshold: 5
  window_minutes: 10
  cooldown_minutes: 30

staffing:
  auto_approve: true
  role_capacity:
    coding_worker: 4
    backend_engineer: 3
    frontend_engineer: 2
    engineering_manager: 2
    technical_director: 1
    reviewer: 4
    judge: 2
    test_reviewer: 2
    spec_reviewer: 2
    security_reviewer: 2
    edge_case_reviewer: 2
    architecture_reviewer: 1
