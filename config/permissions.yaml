profiles:
  human_owner:
    permissions: ["*"]
  secretary:
    permissions:
      - task.create
      - task.prioritize
      - staffing.request
      - project.report
  coding_worker:
    permissions:
      - code.edit
      - code.commit
      - test.execute
      - shell.safe
  # 開発部／設計課: スコープ分解・アーキテクチャの設計文書（リポジトリ内の文書を書く）
  design_engineer:
    permissions:
      - code.read
      - code.edit
      - code.commit
  # 開発部／検証課: E2E・受け入れ・デモシナリオのテストコードを書いて実行する
  # （中核の実装者とは別の担当。実装の合否は従来どおり独立検証と判定が決める）
  acceptance_engineer:
    permissions:
      - code.read
      - code.edit
      - code.commit
      - test.execute
      - shell.safe

  engineering_manager:
    permissions:
      - code.read
      - task.create
      - task.prioritize
      - staffing.request
      - validation.read
  technical_director:
    permissions:
      - code.read
      - task.create
      - task.prioritize
      - staffing.request
      - validation.read
  # 部長（重役会議の出席者）。部長所見（head_brief）と、部下の失敗を受けた上司判断（replan）は
  # 読み取り専用の短命 Worker（2026-11-19: 各部の担当は自部の部長へ上申する）。
  # 書き込み・シェル・タスク起票の権限は持たせない（起票は秘書が検証してから行う）。
  qa_director:
    permissions:
      - code.read
      - validation.read
      - project.report
  sales_director:
    permissions:
      - code.read
      - validation.read
      - project.report
  marketing_director:
    permissions:
      - code.read
      - validation.read
      - project.report
  legal_director:
    permissions:
      - code.read
      - validation.read
      - project.report
  operations_director:
    permissions:
      - code.read
      - validation.read
      - project.report
  reviewer:
    permissions:
      - code.read
      - test.execute
      - task.review


  validation_reviewer:
    permissions:
      - code.read
      - test.execute
      - validation.report

  # 検証課（開発部）のテスト検証。以前は *_reviewer の別名で validation_reviewer を使っていた。
  test_reviewer:
    permissions:
      - code.read
      - test.execute
      - validation.report

  security_reviewer:
    permissions:
      - code.read
      - test.execute
      - security.scan.safe
      - validation.report

  completeness_auditor:
    permissions:
      - code.read
      - task.create
      - validation.read
      - project.report
  usability_auditor:
    permissions:
      - code.read
      - task.create
      - validation.read
      - project.report
  quality_auditor:
    permissions:
      - code.read
      - task.create
      - validation.read
      - project.report
  project_coordinator:
    permissions:
      - code.read
      - task.create
      - task.prioritize
      - staffing.request
      - project.report
  product_planner:
    permissions:
      - code.read
      - task.create
      - validation.read
      - project.report
  customer_success:
    permissions:
      - code.read
      - task.create
      - validation.read
      - project.report
  compliance_auditor:
    permissions:
      - code.read
      - task.create
      - validation.read
      - security.scan.safe
      - project.report
  test_auditor:
    permissions:
      - code.read
      - test.execute
      - task.create
      - validation.read
      - project.report
  it_operations:
    permissions:
      - code.read
      - code.edit
      - task.create
      - shell.safe
      - project.report
  sales:
    permissions:
      - code.read
      - task.create
      - project.report
  maintenance:
    permissions:
      - code.read
      - task.create
      - project.report
  # 運用保守部／インフラ課（2026-11-19 追加）。本番環境・監視・バックアップ・障害対応の
  # 設計文書（department_work）だけを書く。成果物は秘書が docs/ に保存するので読み取り専用。
  # クラウド・サーバ・ネットワーク機器の操作権限は持たせない。
  infra_engineer:
    permissions:
      - code.read

  judge:
    permissions:
      - code.read
      - validation.read
      - judge.decide
