profiles:
  human_owner:
    permissions: ["*"]
  secretary:
    permissions:
      - task.create
      - task.prioritize
      - staffing.request
      - project.report
  coding_worker:
    permissions:
      - code.edit
      - code.commit
      - test.execute
      - shell.safe
  reviewer:
    permissions:
      - code.read
      - test.execute
      - task.review


  validation_reviewer:
    permissions:
      - code.read
      - test.execute
      - validation.report

  security_reviewer:
    permissions:
      - code.read
      - test.execute
      - security.scan.safe
      - validation.report

  judge:
    permissions:
      - validation.read
      - judge.decide
