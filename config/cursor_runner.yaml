cursor_runner:
  # 実装時点でCursor公式CLI仕様を確認し変更可能にすること
  executable: agent
  print_mode_flag: "-p"
  output_format_flag: "--output-format"
  output_format: json
  timeout_minutes: 45
  # Non-interactive coding should not pause for every safe tool call. Cursor's
  # server-side safety classifier still reviews actions; --force is not used.
  auto_review: true
  sandbox: enabled
  # Reviewers/Judges cannot edit; supervisors only produce a plan/decision.
  read_only_mode: ask
  supervisor_mode: plan
  model_by_role: {}
  use_worktrees: false
  require_evidence_match: true
  # Non-interactive: trust the configured workspace (not --force/--yolo).
  trust_workspace: true
  # workspace: null  # optional --workspace path
