[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-company"
version = "0.1.0"
description = "Safe Cursor Workforce Orchestrator: Queue + Scheduler + Cost Guard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
ai-company = "ai_company.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_company"]

[tool.hatch.build.targets.wheel.sources]
"src/ai_company" = "ai_company"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_company"]
